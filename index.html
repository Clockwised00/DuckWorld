<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b49">
  <title>DuckWorld | Secure Vault</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap');

    :root {
      --ink: #102d36;
      --deep: #123b49;
      --cream: #fff8e8;
      --yellow: #f8c849;
      --orange: #eb8841;
      --water: #76c5c1;
      --line: rgba(255, 248, 232, .28);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--cream);
      background: var(--deep);
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
    }

    .scene {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      padding: 38px 24px;
      background: linear-gradient(90deg, rgba(7, 37, 47, .82) 0%, rgba(9, 44, 53, .62) 45%, rgba(7, 35, 46, .76) 100%), url('images_videos/back1.jpg') center / cover;
    }

    .scene::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .17;
      background-image: linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 80%, transparent);
    }

    .shell {
      width: min(1160px, 100%);
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr);
      gap: clamp(28px, 6vw, 86px);
      align-items: center;
    }

    .intro { animation: rise .7s ease-out both; }
    .eyebrow, .status, .microcopy, .label, .code-display, .key, .footer-note { font-family: 'DM Mono', monospace; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--yellow);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 5px rgba(248, 200, 73, .16);
    }

    h1 {
      max-width: 560px;
      margin: 22px 0 20px;
      font-size: clamp(3.3rem, 7vw, 6.8rem);
      line-height: .88;
      letter-spacing: -.055em;
      font-weight: 700;
    }
    h1 em { color: var(--yellow); font-style: normal; }
    .intro > p {
      max-width: 440px;
      margin: 0;
      color: rgba(255, 248, 232, .76);
      font-size: 16px;
      line-height: 1.65;
    }

    .guard-wrap {
      position: relative;
      width: min(310px, 68vw);
      aspect-ratio: 1;
      margin: 44px 0 0 15px;
    }
    .guard-wrap::before {
      content: '';
      position: absolute;
      inset: 10% -3% -4% 14%;
      border: 1px solid rgba(255,248,232,.35);
      transform: rotate(-8deg);
    }
    .guard-wrap::after {
      content: 'KEEPER ON DUTY';
      position: absolute;
      right: -52px;
      bottom: 30px;
      color: var(--yellow);
      font: 10px 'DM Mono', monospace;
      letter-spacing: .12em;
      transform: rotate(-90deg);
      transform-origin: right bottom;
    }
    .guard {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      filter: drop-shadow(14px 20px 0 rgba(10, 39, 49, .42));
    }

    .vault {
      position: relative;
      padding: clamp(24px, 4vw, 43px);
      color: var(--ink);
      background: rgba(255, 248, 232, .94);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 18px 18px 0 rgba(9, 42, 53, .42);
      animation: rise .7s .12s ease-out both;
    }
    .vault::before, .vault::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      border-color: var(--orange);
      border-style: solid;
    }
    .vault::before { top: 13px; left: 13px; border-width: 2px 0 0 2px; }
    .vault::after { bottom: 13px; right: 13px; border-width: 0 2px 2px 0; }
    .vault-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .vault h2 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.3rem); letter-spacing: -.04em; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #32847b;
      font-size: 10px;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .status::before { content: ''; width: 7px; height: 7px; background: #43aa7c; border-radius: 50%; }
    .microcopy { margin: 9px 0 27px; color: #6c7775; font-size: 11px; line-height: 1.5; }

    .code-display {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 0 16px;
      border: 1px solid #d7d7c9;
      background: rgba(255, 255, 255, .54);
      color: var(--ink);
      font-size: 22px;
      letter-spacing: .24em;
      overflow: hidden;
    }
    .code-display.error { border-color: #ce6550; color: #b94c3b; animation: shake .3s ease; }
    .code-display.success { border-color: #4b9c7c; color: #277358; }
    .label { display: block; margin: 20px 0 8px; color: #63726f; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key, .clear, .unlock {
      border: 1px solid #d6d6c7;
      background: #fffdf5;
      color: var(--ink);
      min-height: 48px;
      font: 500 14px 'DM Mono', monospace;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .key:hover, .clear:hover { transform: translateY(-2px); background: #fff3ce; border-color: #e9bc45; }
    .key:active, .clear:active, .unlock:active { transform: translateY(1px); }
    .key[data-key="0"] { grid-column: 2; }
    .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 8px; }
    .clear { color: #6c7775; }
    .unlock {
      color: #16353b;
      background: var(--yellow);
      border-color: var(--yellow);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .unlock:hover { background: #ffd96c; border-color: #ffd96c; transform: translateY(-2px); }
    .message { min-height: 19px; margin: 17px 0 0; color: #75817d; font-size: 11px; }
    .message.warning { color: #bd5945; }
    .message.success { color: #32806b; }
    .vault.is-open { background: rgba(255, 251, 222, .96); }
    .vault.is-open .unlock { background: #71c5a0; border-color: #71c5a0; }
    .footer-note { position: absolute; bottom: 22px; right: 25px; color: rgba(255,248,232,.62); font-size: 10px; letter-spacing: .06em; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 25% { transform: translateX(-7px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
    @media (max-width: 760px) {
      .scene { padding: 32px 18px 62px; align-items: start; }
      .shell { grid-template-columns: 1fr; gap: 14px; max-width: 540px; }
      .intro { display: grid; justify-items: center; text-align: center; }
      h1 { margin-top: 18px; font-size: clamp(3.2rem, 16vw, 5rem); }
      .intro > p { font-size: 14px; }
      .guard-wrap { width: min(215px, 56vw); margin: 22px auto 24px; }
      .guard-wrap::after { right: -40px; bottom: 20px; }
      .vault { width: 100%; box-shadow: 10px 10px 0 rgba(9, 42, 53, .42); }
      .footer-note { right: 18px; bottom: 14px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow">DuckWorld private wing</div>
        <h1 id="page-title">The pond's<br><em>secret</em> place.</h1>
        <p>A quiet little vault for the things worth keeping close. Only verified keepers may pass the duck guard.</p>
        <div class="guard-wrap">
          <img class="guard" src="images_videos/guard.png" alt="A yellow duck holding a guard's sword">
        </div>
      </section>

      <section class="vault" aria-labelledby="vault-title">
        <div class="vault-header">
          <div>
            <div class="eyebrow" style="color:#e08345">Restricted access</div>
            <h2 id="vault-title">Keeper's vault</h2>
          </div>
          <div class="status">LOCKED</div>
        </div>
        <p class="microcopy">Enter the authorized access code to open the inner pond.</p>
        <div id="codeDisplay" class="code-display" aria-live="polite">_ _ _ _</div>
        <label class="label" for="codeInput">Access code</label>
        <input id="codeInput" type="text" inputmode="text" autocomplete="off" maxlength="9" aria-label="Access code" hidden>
        <div class="keypad" aria-label="Code keypad">
          <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
          <button class="key" type="button" data-key="0">0</button>
        </div>
        <div class="actions">
          <button id="clearButton" class="clear" type="button">Clear</button>
          <button id="unlockButton" class="unlock" type="button">Unlock vault</button>
        </div>
        <p id="message" class="message" role="status">The guard is watching.</p>
      </section>
    </div>
    <div class=""></div>
  </main>

  <script>
    const ACCESS_CODE = '0314';
    let enteredCode = '';
    let attempts = 0;

    const display = document.getElementById('codeDisplay');
    const message = document.getElementById('message');
    const vault = document.querySelector('.vault');
    const status = document.querySelector('.status');

    function renderCode() {
      const visible = enteredCode.padEnd(ACCESS_CODE.length, '_').split('').join(' ');
      display.textContent = visible;
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.className = 'message' + (type ? ' ' + type : '');
    }

    function clearCode() {
      enteredCode = '';
      display.className = 'code-display';
      renderCode();
      setMessage('The guard is watching.');
    }

    function unlock() {
      if (enteredCode === ACCESS_CODE) {
        vault.classList.add('is-open');
        display.className = 'code-display success';
        status.textContent = 'OPEN';
        status.style.color = '#32806b';
        setMessage('Access granted. Welcome to the inner pond.', 'success');
        document.getElementById('unlockButton').textContent = 'Vault unlocked';
        setTimeout(() => { window.location.href = 'homepage.html'; }, 900);
        return;
      }
      attempts += 1;
      display.className = 'code-display error';
      setMessage(attempts >= 3 ? 'Access denied. Take a breath and try again.' : 'That code did not open the lock.', 'warning');
      setTimeout(() => display.classList.remove('error'), 350);
    }

    document.querySelectorAll('[data-key]').forEach((button) => {
      button.addEventListener('click', () => {
        if (enteredCode.length < ACCESS_CODE.length && !vault.classList.contains('is-open')) {
          enteredCode += button.dataset.key;
          renderCode();
        }
      });
    });

    document.getElementById('clearButton').addEventListener('click', clearCode);
    document.getElementById('unlockButton').addEventListener('click', unlock);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') unlock();
      if (event.key === 'Backspace') {
        enteredCode = enteredCode.slice(0, -1);
        renderCode();
      }
      if (/^[a-zA-Z0-9-]$/.test(event.key) && enteredCode.length < ACCESS_CODE.length) {
        enteredCode += event.key.toUpperCase();
        renderCode();
      }
    });

    renderCode();
  </script>
</body>
</html>
